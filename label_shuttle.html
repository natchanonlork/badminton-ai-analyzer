<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>ติดป้ายตำแหน่งลูก</title>
<style>
body{font-family:Tahoma,sans-serif;margin:12px;background:#111;color:#eee}
#wrap{position:relative;display:inline-block}
video{max-width:100%;max-height:72vh;display:block}
canvas#c{position:absolute;left:0;top:0;width:100%;height:100%;cursor:crosshair}
#lens{position:fixed;right:12px;top:12px;width:240px;height:240px;border:2px solid #4ade80;background:#000;z-index:5}
button,input{font-size:15px;margin:4px 4px 4px 0}
input[type=number]{width:80px}
kbd{background:#333;padding:1px 6px;border-radius:4px}
</style></head><body>
<h3>ติดป้ายตำแหน่งลูก (สำหรับเทรน TrackNet)</h3>
<p>เลือกคลิป ใส่เฟรมเริ่มต้นที่เป็นช่วงแรลลี่ แล้วเดินติดป้ายต่อเนื่องกันเป็นช่วงยาวๆ (เช่น 300–600 เฟรมติดกัน หลายช่วง)<br>
<b>คลิกที่ตัวลูก</b> = บันทึก + ไปเฟรมถัดไป · <kbd>Space</kbd> = ลูกไม่เห็น/อยู่นอกภาพ · <kbd>←</kbd> ย้อน (ลบป้ายเฟรมนั้น) · <kbd>→</kbd> ข้ามโดยไม่บันทึก</p>
<input type="file" id="f" accept="video/*"> fps <input type="number" id="fps" value="30" step="0.01">
เฟรม <input type="number" id="fr" value="0"> <button id="go">ไป</button>
<button id="exp">ดาวน์โหลด labels.csv</button> <span id="st"></span>
<div id="wrap"><video id="v" muted></video><canvas id="c"></canvas></div>
<canvas id="lens" width="240" height="240"></canvas>
<script>
const v=document.getElementById('v'),c=document.getElementById('c'),ctx=c.getContext('2d'),lens=document.getElementById('lens'),lc=lens.getContext('2d');
let fr=0,L={},vname='clip';const fps=()=>+document.getElementById('fps').value||30;
const key=()=>'lbl:'+vname;
function save(){try{localStorage.setItem(key(),JSON.stringify(L))}catch(e){}}
function load(){try{L=JSON.parse(localStorage.getItem(key())||'{}')}catch(e){L={}}}
function seek(n){fr=Math.max(0,n);document.getElementById('fr').value=fr;v.currentTime=(fr+0.5)/fps()}
document.getElementById('f').onchange=e=>{const f=e.target.files[0];if(!f)return;vname=f.name;load();v.src=URL.createObjectURL(f);v.onloadeddata=()=>{c.width=v.clientWidth;c.height=v.clientHeight;seek(+document.getElementById('fr').value)}};
document.getElementById('go').onclick=()=>seek(+document.getElementById('fr').value);
v.onseeked=()=>draw();
function draw(){c.width=v.clientWidth;c.height=v.clientHeight;ctx.clearRect(0,0,c.width,c.height);
 const sx=c.width/v.videoWidth,sy=c.height/v.videoHeight;
 for(let k=fr-4;k<fr;k++){const l=L[k];if(l&&l.v){ctx.fillStyle='rgba(255,255,0,.45)';ctx.beginPath();ctx.arc(l.x*sx,l.y*sy,4,0,7);ctx.fill()}}
 const l=L[fr];if(l&&l.v){ctx.strokeStyle='#0f0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(l.x*sx,l.y*sy,10,0,7);ctx.stroke()}
 const n=Object.keys(L).length,vis=Object.values(L).filter(x=>x.v).length;
 document.getElementById('st').textContent=`เฟรม ${fr}${L[fr]?(L[fr].v?' ✓เห็น':' ✓ไม่เห็น'):''} · ติดป้ายแล้ว ${n} (เห็นลูก ${vis})`}
c.onclick=e=>{const r=c.getBoundingClientRect();
 L[fr]={v:1,x:Math.round((e.clientX-r.left)/r.width*v.videoWidth),y:Math.round((e.clientY-r.top)/r.height*v.videoHeight)};save();seek(fr+1)};
c.onmousemove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*v.videoWidth,y=(e.clientY-r.top)/r.height*v.videoHeight,s=60;
 lc.imageSmoothingEnabled=false;lc.drawImage(v,x-s/2,y-s/2,s,s,0,0,240,240);lc.strokeStyle='#f00';lc.beginPath();lc.moveTo(120,110);lc.lineTo(120,130);lc.moveTo(110,120);lc.lineTo(130,120);lc.stroke()};
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;
 if(e.code=='Space'){e.preventDefault();L[fr]={v:0,x:0,y:0};save();seek(fr+1)}
 else if(e.key=='ArrowLeft'){e.preventDefault();delete L[fr-1];save();seek(fr-1)}
 else if(e.key=='ArrowRight'){e.preventDefault();seek(fr+1)}});
document.getElementById('exp').onclick=()=>{
 const rows=Object.keys(L).map(Number).sort((a,b)=>a-b).map(k=>`${k},${L[k].v},${L[k].x},${L[k].y}`);
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['frame,visible,x,y\n'+rows.join('\n')+'\n'],{type:'text/csv'}));
 a.download='labels.csv';a.click()};
</script></body></html>
